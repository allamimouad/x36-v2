<p-dialog
  header="Permanently delete item"
  [visible]="pendingDelete() !== null"
  (visibleChange)="!$event && deleteCancelled.emit()"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '28rem', maxWidth: '90vw' }"
>
  @if (pendingDelete(); as node) {
    <p>Are you sure you want to permanently delete "{{ node.name }}" {{ node.kind }}?</p>
    <ng-template #footer>
      <button pButton type="button" severity="secondary" (click)="deleteCancelled.emit()">Cancel</button>
      <button pButton type="button" severity="danger" data-testid="pd-confirm-permanent-delete"
        (click)="deleteConfirmed.emit(node)">Confirm</button>
    </ng-template>
  }
  <ng-template #closeicon>
    <span class="material-symbols-outlined" aria-hidden="true">close</span>
  </ng-template>
</p-dialog>

<p-dialog
  header="Cannot restore the item"
  [visible]="restoreError() !== null"
  (visibleChange)="!$event && errorClosed.emit()"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '28rem', maxWidth: '90vw' }"
>
  <p>{{ restoreError() }}</p>
  <ng-template #footer>
    <button pButton type="button" severity="secondary" (click)="errorClosed.emit()">Close</button>
  </ng-template>
  <ng-template #closeicon>
    <span class="material-symbols-outlined" aria-hidden="true">close</span>
  </ng-template>
</p-dialog>
